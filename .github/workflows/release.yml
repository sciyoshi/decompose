name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.2.6
        required: true
        type: string
      flox-source-ref:
        description: Optional Flox packaging fix ref (must retain the release version)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

# Release notes live on the GitHub release and are the source of truth for
# the changelog -- there is no CHANGELOG.md in this repo.

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME"
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi

  upload-assets:
    name: Upload ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            rust-targets: aarch64-unknown-linux-gnu
          - target: universal-apple-darwin
            os: macos-latest
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: decompose
          target: ${{ matrix.target }}
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-flox:
    name: Publish Flox (${{ matrix.system }})
    needs: create-release
    environment: flox
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            os: macos-15
          - system: x86_64-darwin
            os: macos-15-intel
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: x86_64-linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.flox-source-ref || env.RELEASE_TAG }}
          # Flox verifies that the source revision exists on the remote.
          fetch-depth: 0
      - uses: flox/install-flox-action@v2
        with:
          version: '1.17.0'
      - name: Configure publishing branch
        # Keep the tagged source, but give Flox an upstream for remote checks.
        run: |
          git switch -c flox-publish
          git branch --set-upstream-to=origin/main
      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "$RELEASE_TAG" = "v$version"
      - name: Publish to Flox
        run: flox publish --org sciyoshi decompose
        env:
          FLOX_FLOXHUB_TOKEN: ${{ secrets.FLOX_FLOXHUB_TOKEN }}
      - name: Verify published package
        shell: bash
        env:
          FLOX_FLOXHUB_TOKEN: ${{ secrets.FLOX_FLOXHUB_TOKEN }}
        run: |
          verify_dir=$(mktemp -d)
          flox init --dir "$verify_dir" --bare --no-auto-setup
          flox install --dir "$verify_dir" "sciyoshi/decompose@${RELEASE_TAG#v}"
          actual=$(flox activate --dir "$verify_dir" -- decompose --version)
          test "$actual" = "decompose ${RELEASE_TAG#v}"

  publish-crate:
    name: Publish to crates.io
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
